# Change B-side / keys in backend/.env, then recreate backend only (no rebuild):
#   docker compose up -d --force-recreate backend

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nkh-backend:latest
    container_name: nkh-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    env_file:
      - ./backend/.env
    environment:
      # Prefer process env (compose injects from env_file); file mount is backup/edit convenience
      PYTHONPATH: /workspace/backend
    volumes:
      - ./backend/.env:/workspace/backend/.env:ro
      # SQLite 落在项目根 data/（与 docker-compose.yml 同级），替换/修改后重启 backend 即生效
      - ./data:/workspace/backend/data
      # 热点 Excel：容器内路径对应 hotspot_store 的 /workspace/英文字段.xlsx
      - ./英文字段.xlsx:/workspace/英文字段.xlsx:ro
      # 敏感词 Excel：表空时 seed 到 SQLite（sensitive_word_store）
      - ./sensitiveword.xlsx:/workspace/sensitiveword.xlsx:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nkh-frontend:latest
    container_name: nkh-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
